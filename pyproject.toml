[project]
name = "tox21-research"
version = "1.0.0"
description = "Reproducible multi-endpoint toxicity prediction on public Tox21 data"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "龙神一族" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: real-data regression tests (require downloaded raw data; run with 'pytest -m slow')",
]

[tool.ruff]
line-length = 100
